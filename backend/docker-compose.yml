services:
  db:
    image: postgres:17.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published on 5432 (commonly taken); override DB_HOST_PORT to change the host port.
    ports:
      - "${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      # Built from the POSTGRES_* values above; the host name is the compose service `db`.
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}"
      # DEV DEFAULT ONLY - set a long random JWT_SECRET for anything beyond local use.
      JWT_SECRET: "${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-30}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-7}"
      OTP_TTL_MINUTES: "${OTP_TTL_MINUTES:-10}"
      OTP_LENGTH: "${OTP_LENGTH:-6}"
      EXPOSE_DEV_CODES: "${EXPOSE_DEV_CODES:-true}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      FREE_EMAIL_DOMAINS: "${FREE_EMAIL_DOMAINS:-gmail.com,yahoo.com,yahoo.co.in,outlook.com,hotmail.com,live.com,rediffmail.com,aol.com,icloud.com,proton.me,protonmail.com,mail.com,gmx.com,yandex.com,zoho.com}"
      SITE_URL: "${SITE_URL:-http://localhost:8000}"
      MAX_RESUME_MB: "${MAX_RESUME_MB:-5}"
      MAX_IMAGE_MB: "${MAX_IMAGE_MB:-2}"
      UPLOAD_DIR: /app/uploads
      JOB_EXPIRY_DAYS: "${JOB_EXPIRY_DAYS:-30}"
      DEFAULT_JOB_QUOTA: "${DEFAULT_JOB_QUOTA:-10}"
      DEMO_CREDITS: "${DEMO_CREDITS:-50}"
      EXPIRING_SOON_DAYS: "${EXPIRING_SOON_DAYS:-3}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_LOGIN: "${RATE_LIMIT_LOGIN:-30}"
      RATE_LIMIT_OTP: "${RATE_LIMIT_OTP:-15}"
      RATE_LIMIT_SEARCH: "${RATE_LIMIT_SEARCH:-120}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      MAX_PAGE_SIZE: "${MAX_PAGE_SIZE:-100}"
      DEFAULT_PAGE_SIZE: "${DEFAULT_PAGE_SIZE:-20}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
      EMAIL_SENDER: "${EMAIL_SENDER:-log}"
      OTP_SENDER: "${OTP_SENDER:-log}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@jobportal.demo}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-Admin@12345}"
      SEED_RECRUITER_PASSWORD: "${SEED_RECRUITER_PASSWORD:-Recruiter@123}"
      SEED_SEEKER_PASSWORD: "${SEED_SEEKER_PASSWORD:-Seeker@12345}"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
